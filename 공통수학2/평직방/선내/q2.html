<body>
    <div class="problem-header">
        <h2>문제 2</h2>
        <span id="difficulty">난이도: 중</span>
        <input id="input" type="number" min="0" max="999" placeholder="답안" required>
        <button id="submit" onclick="checkAnswer(14);">제출하기</button>
        <span id="output"></span>
    </div>

    <div class="problem-container">
        <p style="margin-bottom: 30px;">
            두 점 $\text{A}\left(2, 5\right)$, $\text{B}\left(4, 6\right)$에 대하여 선분 $\text{BA}$를 $a : b$로 내분하는 점 $\text{P}\left(x, y\right)$가 있다.
            $x : y = 1 : 2$일 때, $10 \times \frac{a + 5b}{2a + b}$의 값을 구하시오.
        </p>
        
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="canvas-controls">
        <button onclick="clearCanvas();">필기 지우기</button>
    </div>
