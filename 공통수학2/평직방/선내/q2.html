<body>
    <div class="problem-header">
        <h2>문제 2</h2>
        <span id="difficulty">난이도: 하 +</span>
        <input id="input" type="number" min="0" max="999" placeholder="답안" required>
        <button id="submit" onclick="checkAnswer(8);">제출하기</button>
        <span id="output"></span>
    </div>

    <div class="problem-container">
        <p>
            좌표평면 상에서 떨어진 거리가 $10 \,$인 두 점 $\left(m, \, 4\right) \,$, $\left(n, \, -2\right) \,$이 있다. 이 두 점에서 각각 $x \,$축에 내린 수선의 발 사이의 거리를 구하시오.
        </p>
        
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="canvas-controls">
        <button onclick="clearCanvas();">필기 지우기</button>
    </div>
</body>
