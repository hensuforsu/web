<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script defer src="../../../katex-init.js"></script>

    <link rel="stylesheet" href="../../../style.css">

    <script defer src="../../../checkAnswer.js"></script>
    <script defer src="../../../paint.js"></script>
</head>

<body>
    <div class="problem-header">
        <h2>문제 1</h2>
        <span id="difficulty">난이도: 하</span>
        <input id="input" type="number" min="0" max="999" placeholder="답안" required>
        <button id="submit" onclick="checkAnswer(3);">제출하기</button>
        <span id="output"></span>
    </div>

    <div class="problem-container">
        <p>
            두 조건 $p \,$, $q \,$의 서로 다른 두 진리집합 $P \,$, $Q \,$에 대하여 $P \subset Q \,$일 때, <br>
            다음 [보기] 중 옳은 것의 개수를 구하시오.
        </p>

        <div class="example-box">
            <div class="example-title">[보기]</div>
            <div class="example-content">
                (가) 명제 $p \rightarrow q \,$는 참이다. <br>
                (나) 명제 $q \rightarrow p \,$는 거짓이다. <br>
                (다) 명제 $\sim q \rightarrow \, \sim p \,$는 참이다.
            </div>
        </div>

        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="canvas-controls">
        <button onclick="clearCanvas();">필기 지우기</button>
    </div>
</body>

</html>
