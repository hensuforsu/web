    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>

</head>

<body>
    <div class="problem-header">
        <h2>문제 3</h2>
        <span id="difficulty">난이도: 하</span>
        <input id="input" type="number" min="0" max="999" placeholder="답안" required>
        <button id="submit" onclick="checkAnswer(6);">제출하기</button>
        <span id="output"></span>
    </div>

    <div class="problem-container">
        <p>
            명제 '$x^{2} - x - a \neq 0 \,$이면 $x \neq 3 \,$이다.'가 참일 때, 상수 $a \,$의 값을 구하시오.
        </p>

        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="canvas-controls">
        <button onclick="clearCanvas();">필기 지우기</button>
    </div>
</body>
